tls:
  certificates:
    - certFile: /certs/fullchain.pem
      keyFile: /certs/privkey.pem
  options:
    default:
      minVersion: VersionTLS12
      # Raw TCP forwarding cannot translate HTTP/2 for HTTP/1.1 backends.
      alpnProtocols: [http/1.1]
http:
  middlewares:
    permanent-https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
