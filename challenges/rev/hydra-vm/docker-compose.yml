services:
  hydra:
    build:
      context: .
      target: runtime
    platform: linux/amd64
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PUBLIC_PORT:-34001}:31337"
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
