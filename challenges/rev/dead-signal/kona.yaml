challenges:
- name: DEAD SIGNAL
  author: '[bg0d](https://github.com/bg0d-glitch)'
  category: rev
  description: |
    A satellite transmitted its final encrypted authentication sequence before
    disappearing. Investigators recovered its authentication software — but the
    valid recovery token was never written down.

    The recovered terminal will only release its payload to the one correct
    **24-character authentication token**.

    Reverse engineer `dead_signal`, reconstruct the valid token, and capture the
    flag.

    The token is exactly 24 characters from `A-Z` and `0-9`. Exactly one token is
    valid, everything needed to recover it is inside the binary, and patching the
    binary to skip the check will not give up the flag — you need the real token.

    `dead_signal` runs on any modern x86_64 Linux system (glibc).
  hidden: false
