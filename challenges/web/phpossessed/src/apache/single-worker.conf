# Single prefork child: PHP2Shell (CVE-2026-109618) is a cross-request bug,
# so every request must be served by the same process with the same mappings.
# KeepAlive Off keeps connection handling strictly request-by-request.
#
# Loaded from /etc/apache2/conf-enabled/ after mods-enabled, so these values
# override the distro defaults in mods-enabled/mpm_prefork.conf.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
