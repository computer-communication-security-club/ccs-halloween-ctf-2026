# player ──HTTP──▶ apache2 (prefork, ONE child) + mod_php
#
# One static prefork child: PHP2Shell (CVE-2026-109618) is a cross-request
# bug, so every request must hit the same worker. The runtime is the stock
# php:8.4.26-apache image with the stock php.ini-production — VULNERABLE on
# purpose (8.4.27 fixed PHP2Shell). Do not bump the base image.
# One service, one published port, no volumes, no backend.
services:
  chall:
    build:
      context: .
      target: app
    platform: linux/amd64
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PUBLIC_PORT:-32003}:8080"
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    tmpfs:
      # session files (the flag's way back out) and the app's temp dir
      - /tmp:size=16m,mode=1777
      # apache pid + mutex dirs (the image ships them root-owned)
      - /var/run/apache2:size=1m,mode=0777
      - /var/lock:size=1m,mode=0777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
