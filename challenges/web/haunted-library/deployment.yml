mode: shared
protocol: http
architecture: linux/amd64
service: chall
internal_port: 8080
public_port: 32001
solver: automated
readiness: GET / returns 200; solver verifies the intended read.
reset: docker compose down --volumes --remove-orphans; docker compose up -d --build
state: No volumes or persistent state; recreate containers to reset.
ttl_minutes: null
egress: none
notes: No bot, database, or external service dependency.
