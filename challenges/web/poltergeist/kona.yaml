    (the binary ships stripped); prove a spirit *can* linger, seize the worker, and
    make it read aloud the one name it keeps on disk and never speaks.

    The door is warded: the ritual chamber asks a small toll before it listens
    (`GET /pow` — a proof-of-work), and turns away the clumsy. Read the source.

