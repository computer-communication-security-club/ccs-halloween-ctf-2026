services:
  chall:
    build: .
    platform: linux/amd64
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PUBLIC_PORT:-32731}:8080"
    restart: unless-stopped
    environment:
      # Front-door proof-of-work difficulty (leading zero bits); 0 disables it.
      POW_BITS: "${POW_BITS:-24}"
      # The intended solve is a ROP over a saved return address; Intel CET /
      # shadow stack would block it. The binary is already built -fcf-protection=none,
      # and this disables the shadow stack on hosts that would otherwise enforce it.
      GLIBC_TUNABLES: "glibc.cpu.x86_shstk=off"
    user: '10001:10001'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3; grep -q ok <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
