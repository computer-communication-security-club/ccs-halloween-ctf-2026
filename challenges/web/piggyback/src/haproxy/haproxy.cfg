global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Re-resolve edge hostnames via Docker's embedded DNS, so a front that restarts
# (and comes back on a new IP) is picked up instead of leaving the LB stuck on a
# dead address.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s

# Pure TCP (L4) pass-through: TLS is terminated at the edges, so the LB must not
# decrypt. Round-robin alternates connections across the two instances — the
# behaviour the cross-instance replay relies on. `check` drains a dead edge.
frontend tls_in
    bind *:8443
    default_backend fronts

backend fronts
    balance roundrobin
    default-server check inter 2s fall 3 rise 2 resolvers docker init-addr libc,none
    server front1 front1:8443
    server front2 front2:8443
