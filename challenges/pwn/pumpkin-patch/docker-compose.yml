services:
  chall:
    build: .
    platform: linux/amd64
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PUBLIC_PORT:-31001}:5000"
    restart: unless-stopped
    privileged: true
    cpus: 1
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: [CMD, /bin/sh, -c, 'test -x /srv/app/run && test -r /srv/app/flag.txt && kill -0 1']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
