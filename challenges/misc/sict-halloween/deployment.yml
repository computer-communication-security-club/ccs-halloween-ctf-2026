mode: shared
protocol: tcp
architecture: linux/amd64
service: minecraft
internal_port: 25565
public_port: 35001
solver: manual
readiness: >-
  Compose mc-health passes and a Java 26.3 client can join in Adventure mode.
  Run uv run solve/check_endpoint.py HOST PORT for the Minecraft status handshake.
reset: >-
  Whole event instance: docker compose down --volumes --remove-orphans, then
  EULA=TRUE docker compose up -d --build --wait. This erases all player progress.
  One connected player: docker compose exec -T minecraft /opt/sict/admin
  "execute as PLAYER_NAME run function sict:server_reset_player".
state: >-
  The project-scoped server-data volume holds /data: the running map, player
  records, scoreboard progress, generated server properties, private RCON
  credentials, and the server's bundled libraries. Ordinary restarts preserve
  progress; removing the volume imports the pristine private seed again.
ttl_minutes: null
egress: >-
  Offline mode is selected. Deny runtime egress by default at the host firewall.
  If authenticated online mode is enabled later, approve DNS and HTTPS to
  sessionserver.mojang.com, api.minecraftservices.com and profile lookup at
  api.mojang.com. Server binaries are downloaded and checksum-verified at build
  time, not fetched by the runtime entrypoint.
notes: >-
  Manual gameplay solver needs organizer sign-off before merge/release;
  approval is not recorded here. Online authentication, if enabled, also needs
  approval for its external-service dependency.
  Clients need Minecraft Java Edition 26.3. Offline usernames are not authenticated.
  The Connection box provides the copyable Minecraft client address, without an
  nc command or a browser URL. Budget 2 CPUs and 6 GiB per instance
  (4 GiB Java heap); the 20-player default is not load-tested. PvP and friendly fire are enabled; health and hunger deplete normally. Player
  collision is disabled, and sharing fragments between players is permitted.
  Only TCP 35001 is published; RCON stays private. EULA acceptance is an explicit
  operator step. No public map download or player container is provided.
