services:
  minecraft:
    build:
      context: .
      target: runtime
    platform: linux/amd64
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 6g
    pids_limit: 512
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PUBLIC_PORT:-35001}:25565"
    environment:
      EULA: "${EULA:-FALSE}"
      MEMORY: "${MEMORY:-4G}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
    volumes:
      - server-data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 3m
      interval: 15s
      timeout: 10s
      retries: 8
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  server-data:
