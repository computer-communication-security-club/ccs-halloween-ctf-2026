name: Sync rCTF with Konata

on:
  workflow_run:
    workflows: [Challenges]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Finish each sync before another starts; do not interrupt partial uploads.
concurrency:
  group: konata-rctf-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Select a validated main commit
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion) &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      sha: ${{ steps.gate.outputs.sha }}
      challenges: ${{ steps.discover.outputs.challenges }}
    steps:
      - name: Select the latest checks on the current main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$current_sha" != "$TARGET_SHA" ]]; then
            echo 'Skipping a superseded main commit.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            CHECK_RUN_ID=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/challenges.yml/runs" \
              -f head_sha="$TARGET_SHA" -f branch=main -f per_page=100 \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | sort_by(.id) | last | .id // empty')
            if [[ -z "$CHECK_RUN_ID" ]]; then
              echo '::error::Run the Challenges workflow on this main commit before syncing.'
              exit 1
            fi
          fi
          [[ "$CHECK_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CHECK_RUN_ID" > "$RUNNER_TEMP/challenge-run.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CHECK_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$RUNNER_TEMP/challenge-jobs.json"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ steps.gate.outputs.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.2
        if: steps.gate.outputs.ready == 'true'

      - name: Select challenges with passing checks
        id: discover
        if: steps.gate.outputs.ready == 'true'
        env:
          TARGET_SHA: ${{ steps.gate.outputs.sha }}
          GH_REPO: ${{ github.repository }}
        run: uv run tools/select_konata.py "$RUNNER_TEMP/challenge-run.json" "$RUNNER_TEMP/challenge-jobs.json"

  sync:
    name: Sync ${{ matrix.challenge }}
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.challenges != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        challenge: ${{ fromJSON(needs.prepare.outputs.challenges) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Require deployment secrets and select the challenge host
        env:
          RCTF_TOKEN: ${{ secrets.RCTF_TOKEN }}
          CHALLENGE_HOST: ${{ secrets.CHALLENGE_HOST }}
          MINECRAFT_HOST: ${{ secrets.MINECRAFT_HOST }}
          CHALLENGE_PATH: ${{ matrix.challenge }}
        shell: bash
        run: |
          : "${RCTF_TOKEN:?Set the RCTF_TOKEN repository secret}"
          if [[ "$CHALLENGE_PATH" == 'challenges/misc/sict-halloween' ]]; then
            : "${MINECRAFT_HOST:?Set the MINECRAFT_HOST repository secret}"
            CHALLENGE_HOST="$MINECRAFT_HOST"
          else
            : "${CHALLENGE_HOST:?Set the CHALLENGE_HOST repository secret}"
          fi
          echo "CHALLENGE_HOST=$CHALLENGE_HOST" >> "$GITHUB_ENV"

      - name: Sync metadata, flags, and approved handouts
        uses: project-sekai-ctf/konata-deploy-action/sync@a6c31123d0eab4a79539a2225889bbba429f2c83
        with:
          deploy-directory: .
          challenge-path: ${{ matrix.challenge }}
          konata-version: konata==0.0.33
        env:
          RCTF_TOKEN: ${{ secrets.RCTF_TOKEN }}
          LOGURU_LEVEL: WARNING
          LOGURU_DIAGNOSE: 'NO'
