global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Pure TCP (layer-4) pass-through: TLS is terminated at the front instances,
# so the LB must NOT decrypt. Round-robin hands consecutive connections to
# alternating instances — the behaviour the cross-instance replay relies on.
frontend tls_in
    bind *:443
    default_backend fronts

backend fronts
    balance roundrobin
    server front1 front1:8443 check
    server front2 front2:8443 check
