# Piggyback — one command to run it:
#
#     docker compose up --build -d
#
# No pre-steps. `certgen` generates the self-signed cert and the shared ticket
# key into a named volume before the edges start; everything restarts on its own
# if it crashes or the host reboots. Players reach it on :443 (override with
# PUBLISH_PORT). To reset all state (and rotate the ticket key), take it down
# with `docker compose down -v`.
services:
  # One-shot: populate the shared `certs` volume, then exit. Idempotent — on a
  # restart it sees existing certs and leaves the ticket key alone, so resumption
  # tickets already handed out keep working.
  certgen:
    build:
      context: .
      dockerfile: certgen/Dockerfile
    environment:
      DOMAIN: "${DOMAIN:-lab}"
    volumes:
      - certs:/certs
    restart: "no"

  backend:
    build: ./backend
    environment:
      FLAG: "${FLAG:-ccsCTF{0rtt_early_data_desync_x_instance_replay}}"
    expose: ["8080"]
    restart: unless-stopped

  front1:
    build: ./front
    environment:
      INSTANCE: "A"
      LISTEN_PORT: "8443"
      BACKEND_HOST: "backend"
      BACKEND_PORT: "8080"
    volumes:
      - certs:/certs:ro            # same cert AND same ticket.key as front2
    depends_on:
      certgen:
        condition: service_completed_successfully
      backend:
        condition: service_started
    expose: ["8443"]
    restart: unless-stopped

  front2:
    build: ./front
    environment:
      INSTANCE: "B"
      LISTEN_PORT: "8443"
      BACKEND_HOST: "backend"
      BACKEND_PORT: "8080"
    volumes:
      - certs:/certs:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
      backend:
        condition: service_started
    expose: ["8443"]
    restart: unless-stopped

  lb:
    image: haproxy:2.9
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${PUBLISH_PORT:-443}:443"
    depends_on:
      front1:
        condition: service_started
      front2:
        condition: service_started
    restart: unless-stopped

  # Reference exploit. Not part of `up` — run it with:
  #   docker compose run --rm solver
  solver:
    build: ./solver
    environment:
      HOST: "lb"
      PORT: "443"
      SNI: "${DOMAIN:-lab}"
    depends_on:
      lb:
        condition: service_started
    profiles: ["solve"]

volumes:
  certs:
